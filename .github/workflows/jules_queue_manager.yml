name: Jules Queue Manager

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  manage-queue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Queue Manager
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 scripts/auto_trigger_queue.py

      - name: Commit & Push Report Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update Jules queue state & report [skip ci]"
